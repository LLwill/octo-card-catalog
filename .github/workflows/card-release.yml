name: catalog-card-release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cards/**/versions/**"
      - ".github/workflows/card-release.yml"
      - "scripts/catalog-release-records.mjs"
      - "scripts/package-catalog-transfer.mjs"
      - "scripts/write-catalog-relay-request.mjs"

permissions:
  contents: write

concurrency:
  group: catalog-card-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  discover:
    name: discover-releases
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.changed.outputs.paths }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve changed version packages
        id: changed
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'paths=[]' >> "$GITHUB_OUTPUT"
            echo "Manual run: existing immutable Card Releases will be reused"
            exit 0
          fi
          paths="$(node scripts/changed-cards.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --mode release)"
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          echo "Changed release packages: $paths"

  publish:
    name: release-${{ matrix.card-path }}
    runs-on: ubuntu-latest
    needs: discover
    if: ${{ needs.discover.outputs.paths != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        card-path: ${{ fromJSON(needs.discover.outputs.paths) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Publish immutable Card Release
        uses: LLwill/octo-card-forge/actions/card-release@github-delivery/v0.2.0
        with:
          card-path: ${{ matrix.card-path }}
          cli-version: "0.2.4"
          profile-version: "1.2.0-rc.4"
          release-branch: main
          github-token: ${{ github.token }}

  snapshot:
    name: publish-catalog-snapshot
    runs-on: ubuntu-latest
    needs:
      - discover
      - publish
    if: ${{ always() && needs.discover.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.discover.outputs.paths != '[]') && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install pinned Snapshot tooling
        env:
          TOOL_ROOT: ${{ runner.temp }}/octo-card-snapshot-tools
        run: |
          set -euo pipefail
          npm install \
            --prefix "$TOOL_ROOT" \
            --no-save \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            @mlt-org/octo-card-cli@0.2.4
          echo "$TOOL_ROOT/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Collect immutable Card Release records
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/catalog-release-records.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --output .octo-card/catalog-release-records.json

      - name: Build and verify Catalog Snapshot
        id: build
        run: |
          set -euo pipefail
          octo-card snapshot build \
            --input .octo-card/catalog-release-records.json \
            --revision "$GITHUB_SHA" \
            --channel release \
            --out .octo-card/catalog-snapshot.v1.json \
            --format json | tee .octo-card/catalog-snapshot.build.json
          digest="$(node -p "require('./.octo-card/catalog-snapshot.build.json').sha256")"
          printf '%s\n' "$digest" > .octo-card/catalog-snapshot.v1.sha256
          octo-card snapshot verify .octo-card/catalog-snapshot.v1.json --sha256 "$digest" --format json
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Test Catalog transfer packager
        run: node --test tests/package-catalog-transfer.test.mjs

      - name: Package verified Catalog transfer inputs
        id: transfer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/package-catalog-transfer.mjs \
            --snapshot .octo-card/catalog-snapshot.v1.json \
            --catalog-revision "$GITHUB_SHA" \
            --output .octo-card/catalog-transfer.tgz \
            | tee .octo-card/catalog-transfer.build.json
          sha256="$(node -p "require('./.octo-card/catalog-transfer.build.json').sha256")"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Write Catalog relay request
        env:
          TRANSFER_SHA256: ${{ steps.transfer.outputs.sha256 }}
        run: |
          set -euo pipefail
          node scripts/write-catalog-relay-request.mjs \
            --revision "$GITHUB_SHA" \
            --transfer-sha256 "$TRANSFER_SHA256" \
            --repository "$GITHUB_REPOSITORY" \
            --output .octo-card/catalog-relay-request.v1.json

      - name: Upload Catalog release workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-release-${{ github.sha }}
          path: |
            .octo-card/catalog-snapshot.v1.json
            .octo-card/catalog-snapshot.v1.sha256
            .octo-card/catalog-transfer.tgz
            .octo-card/catalog-transfer.tgz.sha256
            .octo-card/catalog-relay-request.v1.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable Catalog Release
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_SHA256: ${{ steps.build.outputs.sha256 }}
          TRANSFER_SHA256: ${{ steps.transfer.outputs.sha256 }}
        run: |
          set -euo pipefail
          tag="catalog-snapshot/$GITHUB_SHA"
          files=(
            catalog-snapshot.v1.json
            catalog-snapshot.v1.sha256
            catalog-transfer.tgz
            catalog-transfer.tgz.sha256
            catalog-relay-request.v1.json
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p .octo-card/existing
            published_assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            for file in "${files[@]}"; do
              if grep -Fxq "$file" <<< "$published_assets"; then
                gh release download "$tag" --pattern "$file" --dir .octo-card/existing
                cmp ".octo-card/$file" ".octo-card/existing/$file"
                echo "Existing immutable Release asset verified: $file"
              else
                gh release upload "$tag" ".octo-card/$file"
                echo "Completed existing Release with missing asset: $file"
              fi
            done
          else
            assets=()
            for file in "${files[@]}"; do
              assets+=(".octo-card/$file")
            done
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Catalog Snapshot ${GITHUB_SHA::12}" \
              --notes "Immutable Octo Card Catalog Snapshot v1. Snapshot SHA-256: $SNAPSHOT_SHA256. Transfer SHA-256: $TRANSFER_SHA256."
          fi
