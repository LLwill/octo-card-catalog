name: catalog-card-release

on:
  workflow_dispatch:
    inputs:
      pipeline-mode:
        description: Forge pipeline mode
        required: true
        default: catalog
        type: choice
        options:
          - catalog
          - bootstrap
  push:
    branches:
      - main
    paths:
      - "cards/**/versions/**"
      - ".github/workflows/card-release.yml"
      - "scripts/catalog-release-records.mjs"
      - "scripts/package-catalog-transfer.mjs"

permissions:
  contents: write

concurrency:
  group: catalog-card-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  discover:
    name: discover-releases
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.changed.outputs.paths }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve changed version packages
        id: changed
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'paths=[]' >> "$GITHUB_OUTPUT"
            echo "Manual run: existing immutable Card Releases will be reused"
            exit 0
          fi
          paths="$(node scripts/changed-cards.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --mode release)"
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          echo "Changed release packages: $paths"

  publish:
    name: release-${{ matrix.card-path }}
    runs-on: ubuntu-latest
    needs: discover
    if: ${{ needs.discover.outputs.paths != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        card-path: ${{ fromJSON(needs.discover.outputs.paths) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Publish immutable Card Release
        uses: LLwill/octo-card-forge/actions/card-release@github-delivery/v0.2.0
        with:
          card-path: ${{ matrix.card-path }}
          cli-version: "0.2.4"
          profile-version: "1.2.0-rc.4"
          release-branch: main
          github-token: ${{ github.token }}

  snapshot:
    name: publish-catalog-snapshot
    runs-on: ubuntu-latest
    needs:
      - discover
      - publish
    if: ${{ always() && needs.discover.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    outputs:
      transfer-sha256: ${{ steps.transfer.outputs.sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install pinned Snapshot tooling
        env:
          TOOL_ROOT: ${{ runner.temp }}/octo-card-snapshot-tools
        run: |
          set -euo pipefail
          npm install \
            --prefix "$TOOL_ROOT" \
            --no-save \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            @mlt-org/octo-card-cli@0.2.4
          echo "$TOOL_ROOT/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Collect immutable Card Release records
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/catalog-release-records.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --output .octo-card/catalog-release-records.json

      - name: Build and verify Catalog Snapshot
        id: build
        run: |
          set -euo pipefail
          octo-card snapshot build \
            --input .octo-card/catalog-release-records.json \
            --revision "$GITHUB_SHA" \
            --channel release \
            --out .octo-card/catalog-snapshot.v1.json \
            --format json | tee .octo-card/catalog-snapshot.build.json
          digest="$(node -p "require('./.octo-card/catalog-snapshot.build.json').sha256")"
          printf '%s\n' "$digest" > .octo-card/catalog-snapshot.v1.sha256
          octo-card snapshot verify .octo-card/catalog-snapshot.v1.json --sha256 "$digest" --format json
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload Catalog Snapshot workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-snapshot-${{ github.sha }}
          path: |
            .octo-card/catalog-snapshot.v1.json
            .octo-card/catalog-snapshot.v1.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Create immutable Catalog Snapshot Release
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          tag="catalog-snapshot/$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p .octo-card/existing
            gh release download "$tag" --dir .octo-card/existing
            cmp .octo-card/catalog-snapshot.v1.json .octo-card/existing/catalog-snapshot.v1.json
            cmp .octo-card/catalog-snapshot.v1.sha256 .octo-card/existing/catalog-snapshot.v1.sha256
            echo "Existing immutable Snapshot Release verified: $tag"
          else
            gh release create "$tag" \
              .octo-card/catalog-snapshot.v1.json \
              .octo-card/catalog-snapshot.v1.sha256 \
              --target "$GITHUB_SHA" \
              --title "Catalog Snapshot ${GITHUB_SHA::12}" \
              --notes "Immutable Octo Card Catalog Snapshot v1. Canonical SHA-256: $SNAPSHOT_SHA256"
          fi

      - name: Test Catalog transfer packager
        run: node --test tests/package-catalog-transfer.test.mjs

      - name: Package verified Catalog transfer inputs
        id: transfer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/package-catalog-transfer.mjs \
            --snapshot .octo-card/catalog-snapshot.v1.json \
            --catalog-revision "$GITHUB_SHA" \
            --output .octo-card/catalog-transfer.tgz \
            | tee .octo-card/catalog-transfer.build.json
          sha256="$(node -p "require('./.octo-card/catalog-transfer.build.json').sha256")"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Publish immutable transfer package to Forge GitLab
        env:
          FORGE_GITLAB_PACKAGE_USERNAME: ${{ secrets.FORGE_GITLAB_PACKAGE_USERNAME }}
          FORGE_GITLAB_PACKAGE_TOKEN: ${{ secrets.FORGE_GITLAB_PACKAGE_TOKEN }}
          FORGE_GITLAB_TRIGGER_URL: ${{ secrets.FORGE_GITLAB_TRIGGER_URL }}
        run: |
          set -euo pipefail
          test -n "$FORGE_GITLAB_PACKAGE_USERNAME"
          test -n "$FORGE_GITLAB_PACKAGE_TOKEN"
          test -n "$FORGE_GITLAB_TRIGGER_URL"
          project_api_url="${FORGE_GITLAB_TRIGGER_URL%/trigger/pipeline}"
          package_url="$project_api_url/packages/generic/catalog-transfer/$GITHUB_SHA"
          mkdir -p .octo-card/registry-check
          for file in catalog-transfer.tgz catalog-transfer.tgz.sha256; do
            status="$(curl --location --silent --show-error \
              --user "$FORGE_GITLAB_PACKAGE_USERNAME:$FORGE_GITLAB_PACKAGE_TOKEN" \
              --output ".octo-card/registry-check/$file" \
              --write-out '%{http_code}' \
              "$package_url/$file")"
            case "$status" in
              200)
                cmp ".octo-card/$file" ".octo-card/registry-check/$file"
                echo "Existing immutable package file verified: $file"
                ;;
              404)
                curl --fail-with-body --show-error --silent \
                  --user "$FORGE_GITLAB_PACKAGE_USERNAME:$FORGE_GITLAB_PACKAGE_TOKEN" \
                  --upload-file ".octo-card/$file" \
                  "$package_url/$file"
                ;;
              *)
                echo "Unexpected Package Registry response for $file: HTTP $status"
                exit 1
                ;;
            esac
          done
          curl --location --fail-with-body --show-error --silent \
            --user "$FORGE_GITLAB_PACKAGE_USERNAME:$FORGE_GITLAB_PACKAGE_TOKEN" \
            --output .octo-card/registry-check/catalog-transfer.tgz \
            "$package_url/catalog-transfer.tgz"
          curl --location --fail-with-body --show-error --silent \
            --user "$FORGE_GITLAB_PACKAGE_USERNAME:$FORGE_GITLAB_PACKAGE_TOKEN" \
            --output .octo-card/registry-check/catalog-transfer.tgz.sha256 \
            "$package_url/catalog-transfer.tgz.sha256"
          (
            cd .octo-card/registry-check
            sha256sum --check catalog-transfer.tgz.sha256
          )
          cmp .octo-card/catalog-transfer.tgz .octo-card/registry-check/catalog-transfer.tgz

  trigger-deployment:
    name: trigger-forge-catalog-pipeline
    runs-on: ubuntu-latest
    needs:
      - snapshot
    steps:
      - name: Trigger the protected Forge Catalog pipeline
        env:
          FORGE_GITLAB_TRIGGER_URL: ${{ secrets.FORGE_GITLAB_TRIGGER_URL }}
          FORGE_GITLAB_TRIGGER_TOKEN: ${{ secrets.FORGE_GITLAB_TRIGGER_TOKEN }}
          CATALOG_REVISION: ${{ github.sha }}
          CATALOG_TRANSFER_SHA256: ${{ needs.snapshot.outputs.transfer-sha256 }}
          PIPELINE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs['pipeline-mode'] || 'catalog' }}
        run: |
          set -euo pipefail
          test -n "$FORGE_GITLAB_TRIGGER_URL"
          test -n "$FORGE_GITLAB_TRIGGER_TOKEN"
          printf '%s' "$CATALOG_REVISION" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$CATALOG_TRANSFER_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          case "$PIPELINE_MODE" in catalog|bootstrap) ;; *) echo "Invalid pipeline mode"; exit 1 ;; esac
          curl --fail-with-body --show-error --silent \
            --request POST \
            --form "token=$FORGE_GITLAB_TRIGGER_TOKEN" \
            --form "ref=main" \
            --form "variables[PIPELINE_MODE]=$PIPELINE_MODE" \
            --form "variables[CATALOG_REVISION]=$CATALOG_REVISION" \
            --form "variables[CATALOG_TRANSFER_SHA256]=$CATALOG_TRANSFER_SHA256" \
            "$FORGE_GITLAB_TRIGGER_URL"
